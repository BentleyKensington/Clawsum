###############################################################
# Authelia — Clawsum ops SSO (cookie on .clawsum.com)
###############################################################
server:
  address: 'tcp://127.0.0.1:9091'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'
        authn_strategies:
          - name: 'HeaderAuthorization'
            schemes: ['Basic']
          - name: 'CookieSession'

log:
  level: info

theme: dark

totp:
  disable: true

webauthn:
  disable: true

duo_api:
  disable: true

identity_validation:
  reset_password:
    jwt_secret: '{{JWT_SECRET}}'

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: deny
  rules:
    # Public marketing
    - domain: 'clawsum.com'
      policy: bypass
    - domain: 'www.clawsum.com'
      policy: bypass
    # Authelia portal itself
    - domain: 'auth.clawsum.com'
      policy: bypass
    # All other clawsum.com hosts (ops)
    - domain: '*.clawsum.com'
      policy: one_factor
      subject:
        - 'group:admins'

session:
  secret: '{{SESSION_SECRET}}'
  cookies:
    - name: 'clawsum_session'
      domain: 'clawsum.com'
      authelia_url: 'https://auth.clawsum.com'
      default_redirection_url: 'https://boss.clawsum.com'
      same_site: 'lax'
      inactivity: '3d'
      expiration: '14d'
      remember_me: '1M'

regulation:
  max_retries: 8
  find_time: 2m
  ban_time: 5m

storage:
  encryption_key: '{{STORAGE_KEY}}'
  local:
    path: /config/db.sqlite3

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt
