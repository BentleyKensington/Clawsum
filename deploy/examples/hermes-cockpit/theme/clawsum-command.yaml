# Clawsum Command — 5th-gen multi-color CEO cockpit
# Install: bash scripts/install-hermes-cockpit.sh

name: clawsum-command
label: Clawsum Command
description: Patriotic lobster-red CEO cockpit — US flag field, unique sidebar tones

palette:
  background:
    hex: "#070b18"
    alpha: 1.0
  midground: "#c8d6e5"
  foreground:
    hex: "#f0f4f8"
    alpha: 0.10
  warmGlow: "rgba(226, 59, 42, 0.22)"
  noiseOpacity: 0.28

typography:
  fontSans: '"DM Sans", "Segoe UI", system-ui, sans-serif'
  fontMono: '"IBM Plex Mono", ui-monospace, monospace'
  fontDisplay: '"Syne", "DM Sans", sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700&display=swap"
  baseSize: "14px"
  lineHeight: "1.5"
  letterSpacing: "0"

layout:
  radius: "0.45rem"
  density: comfortable

layoutVariant: cockpit

assets:
  logo: "https://clawsum.com/assets/logo.png"
  crest: "https://clawsum.com/assets/logo-mark.png"
  hero: "https://clawsum.com/assets/logo.png"
  bg: "/api/plugins/clawsum-cockpit/assets/bg.svg"

colorOverrides:
  primary: "#e23b2a"
  accent: "#3b82f6"
  destructive: "#bf0a30"
  muted: "#64748b"

customCSS: |
  :root {
    --hud-cyn: #22d3ee;
    --hud-amb: #fbbf24;
    --hud-lim: #a3e635;
    --hud-ros: #e23b2a;
    --hud-vio: #a78bfa;
    --lobster: #e23b2a;
    --glory-red: #bf0a30;
    --glory-blue: #002868;
    --star-white: #f8fafc;
  }
  :root[data-layout-variant="cockpit"] body {
    background-color: #070b18;
  }
  html[data-clawsum-page^="/chat"] #root header,
  html[data-clawsum-page^="/chat"] header {
    min-height: 0 !important;
    padding-top: 0.15rem !important;
    padding-bottom: 0.15rem !important;
  }
  html[data-clawsum-page^="/chat"] #root main {
    padding-top: 0.2rem !important;
  }
  :root[data-layout-variant="cockpit"] body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(226, 59, 42, 0.03) 4px
    );
    mix-blend-mode: screen;
  }
