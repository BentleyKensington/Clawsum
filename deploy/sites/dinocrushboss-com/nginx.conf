server {
    listen 8080;
    server_name dinocrushboss.com www.dinocrushboss.com;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /favicon.ico { alias /usr/share/nginx/html/assets/favicon.png; }
    location = /privacy { return 301 /privacy/; }
    location = /terms { return 301 /terms/; }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location ~* \.(css|svg|png|jpe?g|js|ico|woff2|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }
}
