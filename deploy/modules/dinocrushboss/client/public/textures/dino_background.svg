<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <!-- Mountains -->
  <polygon points="0,200 100,80 200,180 300,60 400,170 500,90 600,200" fill="#4B356D" />
  <polygon points="0,200 50,120 150,160 250,100 350,150 450,70 550,180 600,200" fill="#362A5D" />
  
  <!-- Trees -->
  <g transform="translate(50, 150)">
    <rect x="-5" y="0" width="10" height="20" fill="#6B4226" />
    <polygon points="-20,-30 20,-30 0,-60" fill="#3A8C54" />
    <polygon points="-15,-10 15,-10 0,-40" fill="#3A8C54" />
    <polygon points="-10,0 10,0 0,-20" fill="#3A8C54" />
  </g>
  
  <g transform="translate(150, 170)">
    <rect x="-4" y="0" width="8" height="15" fill="#6B4226" />
    <polygon points="-15,-25 15,-25 0,-50" fill="#3A8C54" />
    <polygon points="-10,-10 10,-10 0,-30" fill="#3A8C54" />
  </g>
  
  <g transform="translate(350, 160)">
    <rect x="-5" y="0" width="10" height="18" fill="#6B4226" />
    <polygon points="-18,-28 18,-28 0,-55" fill="#3A8C54" />
    <polygon points="-12,-12 12,-12 0,-35" fill="#3A8C54" />
  </g>
  
  <g transform="translate(450, 180)">
    <rect x="-3" y="0" width="6" height="12" fill="#6B4226" />
    <polygon points="-12,-20 12,-20 0,-40" fill="#3A8C54" />
    <polygon points="-8,-8 8,-8 0,-25" fill="#3A8C54" />
  </g>
  
  <!-- Dinosaur silhouettes -->
  <g transform="translate(200, 190) scale(0.5)">
    <path d="M0,0 L10,-20 L25,-15 L30,-30 L60,-25 L70,-40 L90,-30 L100,-35 L110,-20 L105,-10 L120,0 Z" fill="#2A1F4A" />
  </g>
  
  <g transform="translate(400, 195) scale(0.4)">
    <path d="M0,0 L20,-30 L40,-25 L50,-40 L70,-45 L90,-30 L100,-35 L110,-25 L130,-30 L150,-15 L160,0 Z" fill="#2A1F4A" />
  </g>
</svg>
