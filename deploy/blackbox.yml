# Blackbox exporter — Clawsum
# http_2xx: internal health endpoints must return 2xx
# http_edge: public Authelia-fronted hosts — 401/302/403 means "edge alive"
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      follow_redirects: true
      preferred_ip_protocol: ip4

  http_edge:
    prober: http
    timeout: 8s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      # Authelia intercept → 401/302 is healthy edge, not downtime
      valid_status_codes: [200, 201, 204, 301, 302, 303, 307, 308, 401, 403]
      follow_redirects: false
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: false
